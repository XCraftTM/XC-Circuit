# Shown in Bot › Settings, grouped by `group`, in this order. `pattern` is a regular
# expression the whole value must match (checked when not empty) and `patternHint`
# says what is expected. `type = "secret"` values go to the system keyring;
# `sensitive = true` hides a text value behind an eye button.
[settings]
token = { type = "secret", group = "Connection", label = "Bot token", required = true, placeholder = "Paste the token from the Discord developer portal", description = "Discord developer portal › your app › Bot › Reset Token.", pattern = '[\w-]{20,}\.[\w-]{4,}\.[\w-]{20,}', patternHint = "A bot token is three parts joined by dots. Copy it again from the developer portal, without spaces or quotes." }
devServer = { type = "text", group = "Slash commands", label = "Dev server id", placeholder = "e.g. 123456789012345678", description = "Commands register on this server instantly while you test. Leave empty to register them globally.", pattern = '\d{17,20}', patternHint = "A server id is 17 to 20 digits. In Discord, turn on Developer Mode, then right-click the server › Copy Server ID." }
prefix = { type = "text", group = "Messages", label = "Text command prefix", default = "!", placeholder = "!", description = "Used by blocks that react to text commands such as !help.", pattern = '\S{1,5}', patternHint = "1 to 5 characters, without spaces." }

# npm packages the runtime libraries need, installed before Run and listed in exports.
[dependencies]
"discord.js" = "^14.28.0"
