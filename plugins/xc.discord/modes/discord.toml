# Bot › Settings: one page per `group` (the page with that name, below),
# settings in this order. `pattern` is a regular expression the whole value
# must match (checked when not empty) and `patternHint` says what is expected.
# `type = "secret"` values go to the system keyring; `sensitive = true` hides
# a text value behind an eye button. Plugins add pages too (see the Plugin API).
[[pages]]
id = "connection"
name = "Connection"
icon = "plug"
description = "How your bot logs in to Discord."
order = 10

[[pages]]
id = "slash-commands"
name = "Slash commands"
icon = "slash"
description = "Where slash commands are registered while you test."
order = 20

[[pages]]
id = "messages"
name = "Messages"
icon = "message"
description = "Text commands, such as !help."
order = 30

[[pages]]
id = "music"
name = "Music"
icon = "volume"
description = "Logins for music sources. All of them are optional."
order = 40

[settings]
token = { type = "secret", group = "Connection", label = "Bot token", required = true, placeholder = "Paste the token from the Discord developer portal", description = "Discord developer portal › your app › Bot › Reset Token.", pattern = '[\w-]{20,}\.[\w-]{4,}\.[\w-]{20,}', patternHint = "A bot token is three parts joined by dots. Copy it again from the developer portal, without spaces or quotes." }
shards = { type = "text", group = "Connection", label = "Shards", placeholder = "Empty, auto or a number", description = "Only for big bots: Discord requires shards from 2500 servers on. auto lets Discord choose how many; all run in this one bot process.", pattern = 'auto|\d{1,3}', patternHint = "auto, or a number of shards such as 2." }
devServer = { type = "text", group = "Slash commands", label = "Dev server id", placeholder = "e.g. 123456789012345678", description = "Commands register on this server instantly while you test. Leave empty to register them globally.", pattern = '\d{17,20}', patternHint = "A server id is 17 to 20 digits. In Discord, turn on Developer Mode, then right-click the server › Copy Server ID." }
youtubeCookie = { type = "secret", group = "Music", label = "YouTube cookie", placeholder = "Optional", description = "Helps when YouTube blocks the bot, and plays age-restricted videos. Use a throwaway Google account: sign in to YouTube in a private window, open the developer tools › Network, and copy the Cookie header of a request to youtube.com." }
spotifyClientId = { type = "text", group = "Music", label = "Spotify client id", placeholder = "Optional", description = "From developer.spotify.com › Dashboard › your app. Without it, Spotify works anonymously, with lower limits." }
spotifyClientSecret = { type = "secret", group = "Music", label = "Spotify client secret", placeholder = "Optional", description = "From the same Spotify app's settings." }
deezerArl = { type = "secret", group = "Music", label = "Deezer ARL", placeholder = "Needed for Deezer", description = "The arl cookie of a Deezer account (developer tools › Application › Cookies on deezer.com). Only for the Deezer source." }
deezerDecryptionKey = { type = "secret", group = "Music", label = "Deezer decryption key", placeholder = "Needed for Deezer", description = "The key Deezer's tracks are decrypted with." }
prefix = { type = "text", group = "Messages", label = "Text command prefix", default = "!", placeholder = "!", description = "Used by blocks that react to text commands such as !help.", pattern = '\S{1,5}', patternHint = "1 to 5 characters, without spaces." }

# npm packages the runtime libraries need, installed before Run and listed in exports.
[dependencies]
"discord.js" = "^14.28.0"
