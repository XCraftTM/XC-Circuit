[[type]]
id = "discord.user"
name = "User"
extends = "object"
color = "#7B83FF"
icon = "user"
check = "v => v?.constructor?.name === 'User'"
description = "A Discord account, the same in every server."

[[type]]
id = "discord.member"
name = "Member"
extends = "object"
color = "#7B83FF"
icon = "user"
check = "v => v?.constructor?.name === 'GuildMember'"
description = "A person inside one server, with roles and a nickname."

[[type.converts]]
to = "discord.user"
via = "v => v.user"

[[type]]
id = "discord.message"
name = "Message"
extends = "object"
color = "#7B83FF"
icon = "message"
check = "v => v?.constructor?.name === 'Message'"
description = "A message in a channel."

[[type]]
id = "discord.channel"
name = "Channel"
extends = "object"
color = "#7B83FF"
icon = "hash"
check = "v => typeof v?.isTextBased === 'function'"
description = "A text, voice, thread or forum channel."

[[type]]
id = "discord.thread"
name = "Thread"
extends = "discord.channel"
color = "#7B83FF"
icon = "branch"
check = "v => v?.isThread?.() === true"
description = "A thread or forum post. It goes wherever a channel does."

[[type]]
id = "discord.voice_channel"
name = "Voice Channel"
extends = "discord.channel"
color = "#7B83FF"
icon = "volume"
check = "v => v?.isVoiceBased?.() === true"
description = "A voice or stage channel. It goes wherever a channel does."

[[type]]
id = "discord.invite"
name = "Invite"
extends = "object"
color = "#7B83FF"
icon = "user-plus"
check = "v => v?.constructor?.name === 'Invite'"
description = "An invite link to a server, with its code, uses and expiry."

[[type]]
id = "discord.poll"
name = "Poll"
extends = "object"
color = "#7B83FF"
icon = "check"
check = "v => v?.constructor?.name === 'Poll'"
description = "A poll on a message: its question, answers and votes."

[[type]]
id = "discord.webhook"
name = "Webhook"
extends = "object"
color = "#7B83FF"
icon = "send"
check = "v => v?.constructor?.name === 'Webhook'"
description = "A webhook: posts in a channel with its own name and picture."

[[type]]
id = "discord.guild"
name = "Server"
extends = "object"
color = "#7B83FF"
icon = "shield"
check = "v => v?.constructor?.name === 'Guild'"
description = "A Discord server."

[[type]]
id = "discord.role"
name = "Role"
extends = "object"
color = "#7B83FF"
icon = "tag"
check = "v => v?.constructor?.name === 'Role'"
description = "A role in a server."

[[type]]
id = "discord.interaction"
name = "Interaction"
extends = "object"
color = "#7B83FF"
icon = "slash"
check = "v => typeof v?.isRepliable === 'function'"
description = "A slash command, button press, menu choice or modal submit that can be answered."

[[type]]
id = "discord.embed"
name = "Embed"
extends = "object"
color = "#3DD9C1"
icon = "embed"
description = "A rich message card with title, description, fields and images."

[[type]]
id = "discord.layout"
name = "Layout"
extends = "object"
color = "#3DD9C1"
icon = "layers"
check = "v => Array.isArray(v?.components)"
description = "A whole message built from Components V2, made with Build Layout. Send it with Send Message set to Layout."

[[type]]
id = "discord.component"
name = "Component"
extends = "object"
color = "#3DD9C1"
icon = "pointer"
description = "A button or select menu to attach to a message."
