id          = "xc.discord"
name        = "Discord Bot"
version     = "1.3.16"
author      = "XC Team"
description = "Blocks, pin types and the build mode for Discord bots made with discord.js."

[engines]
circuit = "^1.0"
# Show Modal's form (the modal field and its Modal Builder) needs this app or newer.
app = "0.1.8"

[dependencies]
"xc.core" = "^1.0"

[contributes]
buildModes = ["modes/*.toml"]
blocks     = ["blocks/**/*.{js,cjs,mjs,ts}"]
pinTypes   = ["types/*.toml"]
classes    = ["types/*.classes.json"]
locales = ["locales/*.toml"]
