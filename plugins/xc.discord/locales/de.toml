"YouTube cookie" = "YouTube-Cookie"
"Optional" = "Optional"
"Helps when YouTube blocks the bot, and plays age-restricted videos. Use a throwaway Google account: sign in to YouTube in a private window, open the developer tools › Network, and copy the Cookie header of a request to youtube.com." = "Hilft, wenn YouTube den Bot blockiert, und spielt Videos mit Altersbeschränkung. Nimm ein Wegwerf-Google-Konto: Melde dich in einem privaten Fenster bei YouTube an, öffne die Entwicklertools › Netzwerk und kopiere den Cookie-Header einer Anfrage an youtube.com."
"Spotify client id" = "Spotify-Client-ID"
"From developer.spotify.com › Dashboard › your app. Without it, Spotify works anonymously, with lower limits." = "Von developer.spotify.com › Dashboard › deine App. Ohne sie funktioniert Spotify anonym, mit niedrigeren Limits."
"Spotify client secret" = "Spotify-Client-Secret"
"From the same Spotify app's settings." = "Aus den Einstellungen derselben Spotify-App."
"Deezer ARL" = "Deezer-ARL"
"Needed for Deezer" = "Für Deezer nötig"
"The arl cookie of a Deezer account (developer tools › Application › Cookies on deezer.com). Only for the Deezer source." = "Der arl-Cookie eines Deezer-Kontos (Entwicklertools › Anwendung › Cookies auf deezer.com). Nur für die Quelle Deezer."
"Deezer decryption key" = "Deezer-Entschlüsselungsschlüssel"
"The key Deezer's tracks are decrypted with." = "Der Schlüssel, mit dem Deezers Titel entschlüsselt werden."
"Connection" = "Verbindung"
"Bot token" = "Bot-Token"
"Discord developer portal › your app › Bot › Reset Token." = "Discord Developer Portal › deine App › Bot › Reset Token."
"Paste the token from the Discord developer portal" = "Füge das Token aus dem Discord Developer Portal ein"
"A bot token is three parts joined by dots. Copy it again from the developer portal, without spaces or quotes." = "Ein Bot-Token besteht aus drei Teilen mit Punkten dazwischen. Kopiere es erneut aus dem Developer Portal, ohne Leerzeichen oder Anführungszeichen."
"Dev server id" = "ID des Test-Servers"
"Commands register on this server instantly while you test. Leave empty to register them globally." = "Befehle werden beim Testen sofort auf diesem Server angemeldet. Leer lassen, um sie global anzumelden."
"e.g. 123456789012345678" = "z. B. 123456789012345678"
"A server id is 17 to 20 digits. In Discord, turn on Developer Mode, then right-click the server › Copy Server ID." = "Eine Server-ID hat 17 bis 20 Ziffern. Schalte in Discord den Entwicklermodus ein und klicke dann mit rechts auf den Server › Server-ID kopieren."
"Text command prefix" = "Präfix für Textbefehle"
"Used by blocks that react to text commands such as !help." = "Für Blöcke, die auf Textbefehle wie !help reagieren."
"1 to 5 characters, without spaces." = "1 bis 5 Zeichen, ohne Leerzeichen."
"Slash commands" = "Slash-Befehle"
