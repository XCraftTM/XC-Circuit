[blocks."discord.find_channel"]
name = "Kanal finden"
description = "Sucht einen Kanal per ID oder per Name in einem Server."

[blocks."discord.set_status"]
name = "Bot-Status setzen"
description = "Ändert Status und Aktivität des Bots, etwa „Schaut 3 Server“."

[blocks."discord.on_button"]
name = "Schaltfläche gedrückt"
description = "Läuft, wenn jemand eine Schaltfläche mit passender eigener ID drückt."

[blocks."discord.on_member_join"]
name = "Mitglied tritt bei"
description = "Läuft, wenn jemand einem Server beitritt, auf dem der Bot ist."

[blocks."discord.on_member_leave"]
name = "Mitglied geht"
description = "Läuft, wenn jemand einen Server verlässt (oder gekickt wird), auf dem der Bot ist."

[blocks."discord.on_message"]
name = "Nachricht gesendet"
description = "Läuft, wenn in einem Kanal, den der Bot sieht, eine Nachricht gesendet wird."

[blocks."discord.on_reaction"]
name = "Reaktion hinzugefügt"
description = "Läuft, wenn jemand auf eine Nachricht reagiert. Gut für Reaktionsrollen."

[blocks."discord.on_slash_command"]
name = "Slash-Befehl"
description = "Läuft, wenn jemand einen deiner Slash-Befehle nutzt. Du baust sie unter Bot › Slash-Befehle."

[blocks."discord.add_role"]
name = "Rolle vergeben"
description = "Gibt einem Mitglied eine Rolle. Die eigene Rolle des Bots muss höher stehen als diese Rolle."

[blocks."discord.find_member"]
name = "Mitglied finden"
description = "Sucht ein Server-Mitglied per ID. Macht aus einem Nutzer ein Mitglied."

[blocks."discord.has_role"]
name = "Hat Rolle"
description = "Ob ein Mitglied eine Rolle hat (per ID oder Name)."

[blocks."discord.member_info"]
name = "Mitglieds-Info"
description = "Liest eine Information über ein Server-Mitglied."

[blocks."discord.moderate"]
name = "Mitglied moderieren"
description = "Schickt ein Mitglied in die Auszeit, kickt, bannt oder entbannt es, entfernt eine Rolle oder ändert den Spitznamen. Der Bot braucht die passende Berechtigung."

[blocks."discord.user_info"]
name = "Nutzer-Info"
description = "Liest eine Information über einen Nutzer (geht auch für Mitglieder)."

[blocks."discord.add_reaction"]
name = "Reaktion hinzufügen"
description = "Reagiert mit einem Emoji auf eine Nachricht."

[blocks."discord.build_embed"]
name = "Embed bauen"
description = "Erstellt ein Rich-Embed. Gestalte es im Embed-Editor; jeder {Platzhalter}, den du tippst, wird zu einem Eingang."

[blocks."discord.button"]
name = "Schaltfläche"
description = "Eine Schaltfläche für eine Nachricht. Drücke kommen beim Ereignis „Schaltfläche gedrückt“ mit derselben eigenen ID an."

[blocks."discord.delete_message"]
name = "Nachricht löschen"
description = "Löscht eine Nachricht, wahlweise nach einer Wartezeit."

[blocks."discord.message_info"]
name = "Nachrichten-Info"
description = "Liest eine Information über eine Nachricht."

[blocks."discord.send_message"]
name = "Nachricht senden"
description = "Antwortet auf einen Befehl oder eine Schaltfläche, oder sendet, beantwortet und bearbeitet Nachrichten in Kanälen."

[blocks."discord.bot_info"]
name = "Bot-Info"
description = "Liest etwas über den Bot selbst: Ping, Laufzeit, Server, seinen Nutzer, einen Einladungslink."

[blocks."discord.create_channel"]
name = "Kanal erstellen"
description = "Erstellt einen neuen Kanal oder eine Kategorie. Der Bot braucht Kanäle verwalten."

[blocks."discord.create_forum_post"]
name = "Forenbeitrag erstellen"
description = "Startet einen Beitrag in einem Forenkanal, mit Tags."

[blocks."discord.create_thread"]
name = "Thread erstellen"
description = "Startet einen Thread an einer Nachricht oder einen neuen in einem Kanal (private Threads für Tickets)."

[blocks."discord.delete_channel"]
name = "Kanal löschen"
description = "Löscht einen Kanal, Thread oder eine Kategorie. Der Bot braucht Kanäle verwalten."

[blocks."discord.edit_channel"]
name = "Kanal bearbeiten"
description = "Ändert Name, Thema, langsamen Modus und mehr. Leere Felder bleiben, wie sie sind."

[blocks."discord.lock_channel"]
name = "Kanal sperren"
description = "Verbietet einer Rolle (standardmäßig @everyone) das Schreiben in einem Kanal, oder erlaubt es wieder."

[blocks."discord.set_bot_profile"]
name = "Bot-Profil ändern"
description = "Ändert Nutzername, Avatar oder Banner des Bots. Discord erlaubt nur wenige Änderungen pro Stunde."

[blocks."discord.set_permissions"]
name = "Kanalberechtigungen setzen"
description = "Erlaubt oder verbietet Berechtigungen in einem Kanal für eine Rolle oder ein Mitglied, etwa um dem Ersteller eines Tickets Zugriff zu geben."

[blocks."discord.thread_action"]
name = "Thread-Aktion"
description = "Archiviert, sperrt oder benennt einen Thread um, oder fügt Mitglieder hinzu und entfernt sie (für private Threads)."

[blocks."discord.on_autocomplete"]
name = "Autovervollständigung"
description = "Läuft, während jemand in eine Slash-Befehl-Option mit Autovervollständigung tippt. Antworte mit Vorschläge senden."

[blocks."discord.on_automod"]
name = "AutoMod-Aktion"
description = "Läuft, wenn Discords AutoMod eine Nachricht blockiert, alarmiert oder jemanden timeoutet."

[blocks."discord.on_ban"]
name = "Mitglied gebannt"
description = "Läuft, wenn jemand auf einem Server gebannt (oder entbannt) wird."

[blocks."discord.on_channel_event"]
name = "Kanal erstellt / gelöscht"
description = "Läuft, wenn ein Kanal erstellt, gelöscht oder geändert wird. Für Server-Logs."

[blocks."discord.on_context_menu"]
name = "Kontextmenü genutzt"
description = "Fügt Discords Rechtsklick-Menü (Apps) einen Eintrag für Nutzer oder Nachrichten hinzu und läuft, wenn ihn jemand nutzt."

[blocks."discord.on_invite_event"]
name = "Einladung erstellt / gelöscht"
description = "Läuft, wenn ein Einladungslink erstellt oder gelöscht wird."

[blocks."discord.on_member_update"]
name = "Mitglied geändert"
description = "Läuft, wenn sich Rollen, Spitzname, Timeout oder Boost eines Mitglieds ändern."

[blocks."discord.on_message_delete"]
name = "Nachricht gelöscht"
description = "Läuft, wenn eine Nachricht gelöscht wird, einmal pro Nachricht (auch bei Massenlöschungen). Für Lösch-Logs."

[blocks."discord.on_message_edit"]
name = "Nachricht bearbeitet"
description = "Läuft, wenn jemand eine Nachricht bearbeitet, die der Bot sieht. Für Bearbeitungs-Logs."

[blocks."discord.on_modal"]
name = "Formular gesendet"
description = "Läuft, wenn jemand ein mit Formular zeigen geöffnetes Formular sendet. Jede Antwort ist ein Ausgang."

[blocks."discord.on_poll_vote"]
name = "Umfragestimme"
description = "Läuft, wenn jemand in einer Umfrage abstimmt (oder die Stimme zurücknimmt)."

[blocks."discord.on_presence"]
name = "Präsenz geändert"
description = "Läuft, wenn sich Status oder Aktivität von jemandem ändert (online, spielt ein Spiel …). Braucht den Presence-Intent im Developer Portal."

[blocks."discord.on_reaction_remove"]
name = "Reaktion entfernt"
description = "Läuft, wenn jemand seine Reaktion zurücknimmt. Für Reaktionsrollen."

[blocks."discord.on_role_event"]
name = "Rolle erstellt / gelöscht"
description = "Läuft, wenn eine Rolle erstellt, gelöscht oder geändert wird. Für Server-Logs."

[blocks."discord.on_scheduled_event"]
name = "Server-Event"
description = "Läuft bei geplanten Events eines Servers: erstellt, beginnt, endet oder jemand interessiert sich."

[blocks."discord.on_select"]
name = "Auswahlmenü genutzt"
description = "Läuft, wenn jemand in einem Auswahlmenü mit passender eigener ID etwas wählt."

[blocks."discord.on_server_event"]
name = "Bot zu Server hinzugefügt"
description = "Läuft, wenn der Bot einem Server beitritt oder entfernt wird."

[blocks."discord.on_thread_create"]
name = "Thread erstellt"
description = "Läuft, wenn ein Thread oder Forenbeitrag erstellt wird."

[blocks."discord.on_voice_state"]
name = "Sprache geändert"
description = "Läuft, wenn jemand einem Sprachkanal beitritt, ihn verlässt oder wechselt, sich stummschaltet, taub stellt oder streamt. Für temporäre Sprachkanäle und Sprach-Logs."

[blocks."discord.discord_text"]
name = "Discord-Text"
description = "Formatiert Text mit Discord-Markdown: fett, Codeblöcke, Spoiler, Überschriften, Zitate, Links …"

[blocks."discord.emoji"]
name = "Emoji"
description = "Ein eigenes Emoji eines Servers nach Name, als Text für Nachrichten und Reaktionen."

[blocks."discord.mention"]
name = "Erwähnung"
description = "Der Text, der jemanden anpingt oder eine Rolle oder einen Kanal verlinkt: <@id>, <@&id>, <#id>."

[blocks."discord.timestamp"]
name = "Zeitstempel"
description = "Eine Zeit, die jede Person in ihrer Zeitzone und Sprache sieht, etwa „in 5 Minuten“."

[blocks."discord.respond_autocomplete"]
name = "Vorschläge senden"
description = "Zeigt Vorschläge, während jemand in eine Option mit Autovervollständigung tippt. Bis zu 25."

[blocks."discord.select_menu"]
name = "Auswahlmenü"
description = "Ein Dropdown für eine Nachricht. Auswahlen kommen bei Auswahlmenü genutzt mit derselben eigenen ID an."

[blocks."discord.show_modal"]
name = "Formular zeigen"
description = "Öffnet ein Formular mit Textfeldern. Es muss die erste Antwort auf einen Befehl, eine Schaltfläche oder ein Menü sein (kein Nachricht senden davor). Antworten kommen bei Formular gesendet an."

[blocks."discord.text_input"]
name = "Textfeld"
description = "Ein Feld zum Tippen, für Formular zeigen. Die Antwort kommt bei Formular gesendet unter seiner ID heraus."

[blocks."discord.check_permission"]
name = "Berechtigung prüfen"
description = "Ob ein Mitglied (oder der Bot) eine Berechtigung hat, auf dem Server oder in einem Kanal."

[blocks."discord.find_user"]
name = "Nutzer finden"
description = "Sucht jeden Discord-Nutzer per ID, auch Leute ohne gemeinsamen Server mit dem Bot."

[blocks."discord.list_members"]
name = "Mitglieder auflisten"
description = "Die Mitglieder eines Servers, oder nur die mit einer Rolle. Braucht den Server-Members-Intent."

[blocks."discord.remove_role"]
name = "Rolle entfernen"
description = "Nimmt einem Mitglied eine Rolle weg. Die eigene Rolle des Bots muss höher stehen als diese Rolle."

[blocks."discord.warnings"]
name = "Verwarnungen"
description = "Speichert Verwarnungen für Mitglieder: eine hinzufügen, auflisten, die letzte entfernen oder alle löschen."

[blocks."discord.bulk_delete"]
name = "Massenlöschen"
description = "Löscht viele neue Nachrichten auf einmal. Discord erlaubt nur Nachrichten unter 14 Tagen."

[blocks."discord.create_poll"]
name = "Umfrage erstellen"
description = "Postet eine Discord-Umfrage. Lies die Ergebnisse mit Umfrageergebnis."

[blocks."discord.find_message"]
name = "Nachricht finden"
description = "Sucht eine Nachricht per ID (in einem Kanal) oder per Link."

[blocks."discord.get_messages"]
name = "Nachrichten lesen"
description = "Liest die neuesten Nachrichten eines Kanals, etwa für ein Ticket-Protokoll."

[blocks."discord.get_reactions"]
name = "Reaktionen lesen"
description = "Wer mit einem Emoji reagiert hat und wie viele. Für Gewinnspiele und Starboards."

[blocks."discord.pin_message"]
name = "Nachricht anheften"
description = "Heftet eine Nachricht im Kanal an, oder löst sie."

[blocks."discord.poll_results"]
name = "Umfrageergebnis"
description = "Liest die Stimmen einer Umfrage und kann sie sofort beenden."

[blocks."discord.publish_message"]
name = "Nachricht veröffentlichen"
description = "Veröffentlicht eine Nachricht in einem Ankündigungskanal, damit folgende Server sie auch bekommen."

[blocks."discord.remove_reaction"]
name = "Reaktion entfernen"
description = "Entfernt Reaktionen von einer Nachricht: die einer Person, alle eines Emojis oder alle."

[blocks."discord.show_typing"]
name = "Tippen anzeigen"
description = "Zeigt „Bot schreibt …“ in einem Kanal für etwa 10 Sekunden oder bis der Bot etwas sendet."

[blocks."discord.wait_for"]
name = "Auf Antwort warten"
description = "Wartet auf eine Antwort: eine Nachricht, einen Schaltflächen-Klick oder eine Reaktion. Geht bei Erhalten oder bei Zeit abgelaufen weiter."

[blocks."discord.webhook_send"]
name = "Per Webhook senden"
description = "Sendet eine Nachricht unter beliebigem Namen und Avatar, über einen Webhook."

[blocks."discord.create_role"]
name = "Rolle erstellen"
description = "Erstellt eine neue Rolle auf einem Server. Der Bot braucht Rollen verwalten."

[blocks."discord.delete_role"]
name = "Rolle löschen"
description = "Löscht eine Rolle vom Server. Der Bot braucht Rollen verwalten und eine höhere Rolle."

[blocks."discord.edit_role"]
name = "Rolle bearbeiten"
description = "Ändert Name, Farbe, Berechtigungen und mehr einer Rolle. Leere Felder bleiben, wie sie sind."

[blocks."discord.find_role"]
name = "Rolle finden"
description = "Sucht eine Rolle eines Servers per ID, Name oder Erwähnung."

[blocks."discord.list_roles"]
name = "Rollen auflisten"
description = "Alle Rollen eines Servers, die höchste zuerst."

[blocks."discord.role_info"]
name = "Rollen-Info"
description = "Liest eine Information über eine Rolle. Mitgliederlisten brauchen den Server-Members-Intent."

[blocks."discord.audit_log"]
name = "Audit-Log"
description = "Liest das Audit-Log des Servers: wer was getan hat (Kicks, Bans, Löschungen, Rollenänderungen …). Der Bot braucht Audit-Log anzeigen."

[blocks."discord.automod_rule"]
name = "AutoMod-Regel"
description = "Richtet Discords eingebautes AutoMod ein: Nachrichten mit bestimmten Wörtern blockieren, einen Kanal alarmieren oder Leute timeouten. Der Bot braucht Server verwalten."

[blocks."discord.create_invite"]
name = "Einladung erstellen"
description = "Erstellt einen Einladungslink zu einem Kanal."

[blocks."discord.edit_server"]
name = "Server bearbeiten"
description = "Ändert Name, Symbol, Banner, Beschreibung, Systemkanal oder Verifizierungsstufe des Servers. Leere Felder bleiben, wie sie sind. Der Bot braucht Server verwalten."

[blocks."discord.emojis"]
name = "Server-Emojis"
description = "Fügt eigene Emojis eines Servers hinzu, löscht sie oder listet Emojis und Sticker auf. Zum Ändern braucht der Bot Ausdrücke verwalten."

[blocks."discord.leave_server"]
name = "Server verlassen"
description = "Lässt den Bot einen Server verlassen."

[blocks."discord.list_invites"]
name = "Einladungen auflisten"
description = "Die Einladungslinks eines Servers mit Nutzungen und Erstellern. Für Einladungs-Tracking. Der Bot braucht Server verwalten."

[blocks."discord.scheduled_event"]
name = "Geplantes Event"
description = "Erstellt, ändert, startet, beendet, löscht oder listet geplante Events eines Servers."

[blocks."discord.server_info"]
name = "Server-Info"
description = "Liest eine Information über einen Server."

[blocks."discord.voice_action"]
name = "Sprachmitglied"
description = "Verschiebt ein Mitglied in einen anderen Sprachkanal, trennt es, schaltet es stumm oder taub. Der Bot braucht Mitglieder verschieben, stummschalten oder taub stellen."

[blocks."discord.build_layout"]
name = "Layout bauen"
description = "Gestaltet eine ganze Nachricht mit Components V2: Container, Text, Abschnitte mit Bild oder Button, Galerien, Dateien, Trenner, Buttons und Menüs. Verbinde es mit „Nachricht senden“ im Format Layout."
