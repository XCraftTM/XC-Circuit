id          = "xc.server"
name        = "Server Tools"
version     = "1.0.0"
author      = "XC Team"
description = "Blocks for looking after servers: SSH commands, CPU/RAM/disk use, Docker containers, RCON, Minecraft server status and port checks. SSH, RCON and Docker only run once allowed in Bot › Settings › Server tools."

[engines]
circuit = "^1.0"
app = "0.1.3"

[dependencies]
"xc.core" = "^1.0"

[contributes]
blocks      = ["blocks/*.{js,cjs,mjs,ts}"]
botSettings = ["settings/*.toml"]
locales     = ["locales/*.toml"]
