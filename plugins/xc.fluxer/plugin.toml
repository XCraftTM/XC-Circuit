id          = "xc.fluxer"
name        = "Fluxer Bot"
version     = "1.2.1"
author      = "XC Team"
description = "Blocks, pin types and the build mode for Fluxer bots made with fluxer.js."

[engines]
circuit = "^1.0"
# Multi-select fields need this app or newer.
app = "0.1.6"

[dependencies]
"xc.core" = "^1.0"

[contributes]
buildModes = ["modes/*.toml"]
blocks     = ["blocks/**/*.{js,cjs,mjs,ts}"]
pinTypes   = ["types/*.toml"]
locales    = ["locales/*.toml"]
