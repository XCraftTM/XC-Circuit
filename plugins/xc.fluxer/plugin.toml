id          = "xc.fluxer"
name        = "Fluxer Bot"
version     = "1.2.9"
author      = "XC Team"
description = "Blocks, pin types and the build mode for Fluxer bots made with fluxer.js."

[engines]
circuit = "^1.0"
# Its starters are projects of layout 2, which this app or newer reads.
app = "0.3.0"

[dependencies]
"xc.core" = "^1.0"

[contributes]
buildModes = ["modes/*.toml"]
blocks     = ["blocks/**/*.{js,cjs,mjs,ts}"]
pinTypes   = ["types/*.toml"]
locales    = ["locales/*.toml"]
