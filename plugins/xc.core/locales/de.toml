"Click the glowing Add block button at the bottom of the canvas." = "Klicke unten auf der Arbeitsfläche auf den leuchtenden Knopf Block hinzufügen."
"Click Math in the list." = "Klicke in der Liste auf Math."
"Type Math into the glowing search box." = "Tippe Math in das leuchtende Suchfeld."
"The Math block is gone: go Back a step and add it again." = "Der Math-Block ist weg: Geh einen Schritt Zurück und füge ihn wieder hinzu."
"Press on the glowing Result pin of Math, keep the mouse button down, and let go on the glowing Message pin of Log." = "Drück auf den leuchtenden Result-Pin von Math, halte die Maustaste gedrückt und lass sie auf dem leuchtenden Message-Pin von Log los."
"Math or Log is out of view: drag empty canvas until you see both." = "Math oder Log ist nicht zu sehen: Zieh die leere Arbeitsfläche, bis du beide siehst."
"The Math block is gone: go Back two steps and add it again." = "Der Math-Block ist weg: Geh zwei Schritte Zurück und füge ihn wieder hinzu."
"Click the glowing Math block to choose it." = "Klicke auf den leuchtenden Math-Block, um ihn auszuwählen."
"Set A to 2 and B to 3 in the glowing boxes: click a number and type it (or drag it left and right)." = "Setze in den leuchtenden Feldern A auf 2 und B auf 3: Klicke auf eine Zahl und tippe sie ein (oder zieh sie nach links und rechts)."
"Operation isn't Add any more: set it back to Add." = "Operation ist nicht mehr Add: Stell sie wieder auf Add."
"Click the glowing Run button at the top (or press F5)." = "Klicke oben auf den leuchtenden Knopf Starten (oder drück F5)."
"The bot stopped with an error. The Console below says why; Run tries again." = "Der Bot hat mit einem Fehler aufgehört. Die Konsole unten sagt, warum; Starten versucht es noch einmal."
"Done! Click Next." = "Geschafft! Klicke auf Weiter."
"Let's go" = "Los geht's"
"That wire ends at {pin} on {block}. Drag from Result again, and let go on the glowing Message pin of Log." = "Diese Verbindung endet bei {pin} an {block}. Zieh noch einmal von Result und lass auf dem leuchtenden Message-Pin von Log los."
"Message gets {pin} of {block}. It should get Result of Math: drag from Math's Result pin." = "Message bekommt {pin} von {block}. Es soll Result von Math bekommen: Zieh vom Result-Pin von Math."
"{label} = {got}, should be {want}" = "{label} = {got}, soll {want} sein"
"Your bot wrote {text}, not 5. Go Back to check Math's numbers and the wire, then run it again." = "Dein Bot hat {text} geschrieben, nicht 5. Geh Zurück, prüf die Zahlen von Math und die Verbindung und starte ihn dann noch einmal."
"Let's build a tiny bot" = "Bauen wir einen kleinen Bot"
"It takes about two minutes. Whatever you need to click next glows, and if you get stuck, Do it for me does the step. This is a practice project: nothing of yours changes." = "Das dauert etwa zwei Minuten. Was du als Nächstes anklicken musst, leuchtet, und wenn du nicht weiterkommst, erledigt Mach es für mich den Schritt. Das ist ein Übungsprojekt: An deinen Sachen ändert sich nichts."
"Bots are made of blocks" = "Bots bestehen aus Blöcken"
"Bot Started runs once when the bot starts. The green wire then runs Log, which writes a line in the Console. Drag empty space to look around; the mouse wheel zooms." = "Bot Started läuft einmal, wenn der Bot startet. Die grüne Verbindung lässt danach Log laufen, das eine Zeile in die Konsole schreibt. Zieh leere Fläche, um dich umzusehen; das Mausrad zoomt."
"Add a Math block" = "Füge einen Math-Block hinzu"
"Math adds two numbers. Your bot will say the answer." = "Math addiert zwei Zahlen. Dein Bot sagt das Ergebnis."
"Wire Math to Log" = "Verbinde Math mit Log"
"Coloured wires carry values from one block to another." = "Farbige Verbindungen bringen Werte von einem Block zum anderen."
"Fill in the numbers" = "Trag die Zahlen ein"
"A block's settings are in the Inspector on the right, and on the block itself." = "Die Einstellungen eines Blocks stehen rechts im Inspektor und auf dem Block selbst."
"Run your bot" = "Starte deinen Bot"
"XC Circuit starts the bot. The blocks light up as they run." = "XC Circuit startet den Bot. Die Blöcke leuchten auf, während sie laufen."
"It worked!" = "Es hat geklappt!"
"Your bot wrote 5, the answer from Math, in the Console. Everything a bot says shows up here, errors too, with a link to the block that said it." = "Dein Bot hat 5, das Ergebnis von Math, in die Konsole geschrieben. Alles, was ein Bot sagt, erscheint hier, auch Fehler, mit einem Link zum Block, der es gesagt hat."
"Search here (or press Ctrl+P) for any command, workspace or block. Settings are behind the gear, or Ctrl+,." = "Such hier (oder drück Strg+P) nach Befehlen, Arbeitsbereichen und Blöcken. Die Einstellungen sind hinter dem Zahnrad, oder Strg+,."
"Discord and Fluxer bots work the same way, with events like Slash Command and actions like Send Message. Where to next?" = "Discord- und Fluxer-Bots funktionieren genauso, mit Ereignissen wie Slash Command und Aktionen wie Send Message. Wie geht es weiter?"
"Minecraft server status" = "Minecraft-Serverstatus"
"/status says whether your Minecraft server is up, how many players are on and its message of the day. Put your server's address in Minecraft Server (Java or Bedrock)." = "/status sagt, ob dein Minecraft-Server läuft, wie viele Spieler online sind und was seine Nachricht des Tages ist. Trag die Adresse deines Servers in Minecraft Server ein (Java oder Bedrock)."
"!status says whether your Minecraft server is up, how many players are on and its message of the day. Put your server's address in Minecraft Server (Java or Bedrock)." = "!status sagt, ob dein Minecraft-Server läuft, wie viele Spieler online sind und was seine Nachricht des Tages ist. Trag die Adresse deines Servers in Minecraft Server ein (Java oder Bedrock)."
"Posts each new YouTube video in a channel of your server. Set the YouTube channel in On New Post (or switch it to Twitch, Reddit, Bluesky, an RSS feed …) and your channel id in Find Channel." = "Postet jedes neue YouTube-Video in einen Kanal deines Servers. Trag den YouTube-Kanal in On New Post ein (oder stell auf Twitch, Reddit, Bluesky, einen RSS-Feed …) und die ID deines Kanals in Find Channel."
"Reminders" = "Erinnerungen"
"/remind after:10m what:Take a break posts a reminder in the same channel when the time is up: 30s, 10m, 2h, 3d … They survive restarts of the bot." = "/remind after:10m what:Pause machen postet eine Erinnerung in denselben Kanal, wenn die Zeit um ist: 30s, 10m, 2h, 3d … Sie überstehen Neustarts des Bots."
"!remind 10m Take a break posts a reminder in the same channel when the time is up: 30s, 10m, 2h, 3d … They survive restarts of the bot." = "!remind 10m Pause machen postet eine Erinnerung in denselben Kanal, wenn die Zeit um ist: 30s, 10m, 2h, 3d … Sie überstehen Neustarts des Bots."
"Verify with a captcha" = "Verifizieren mit Captcha"
"/verify shows a captcha only the member sees: a picture with a code to type. Passed, they get the role in Add Role (set its id there); wrong or too slow, they can use /verify again." = "/verify zeigt ein Captcha, das nur das Mitglied sieht: ein Bild mit einem Code zum Abtippen. Bestanden, bekommt es die Rolle aus Add Role (trag dort ihre ID ein); falsch oder zu langsam, kann es /verify noch einmal nutzen."
"!verify asks for the code in a picture, right in the channel. Passed, the member gets the role in Change Role (set it there); wrong or too slow, they can type !verify again." = "!verify fragt direkt im Kanal nach dem Code aus einem Bild. Bestanden, bekommt das Mitglied die Rolle aus Change Role (trag sie dort ein); falsch oder zu langsam, kann es noch einmal !verify tippen."
