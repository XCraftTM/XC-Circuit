"From nodejs.org, checked against its published checksum, then installed without questions. Windows asks for permission." = "Von nodejs.org, mit der veröffentlichten Prüfsumme geprüft und dann ohne Rückfragen installiert. Windows fragt nach der Erlaubnis."
