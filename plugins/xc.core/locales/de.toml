[blocks."core.get_stored"]
name = "Gespeicherten Wert lesen"
description = "Liest einen mit „Wert speichern“ gesicherten Wert. Übersteht Neustarts des Bots."

[blocks."core.increase_stored"]
name = "Gespeicherten Wert erhöhen"
description = "Addiert zu einer gespeicherten Zahl, beginnend bei 0. Mit einem negativen Betrag wird abgezogen."

[blocks."core.json"]
name = "JSON"
description = "Macht aus Text ein Objekt (parse) oder aus einem Objekt Text (stringify)."

[blocks."core.set_stored"]
name = "Wert speichern"
description = "Speichert einen Wert, damit er Neustarts des Bots übersteht."

[blocks."core.date"]
name = "Datum & Uhrzeit"
description = "Die aktuelle Zeit (oder ein bestimmtes Datum), verschoben und formatiert."

[blocks."core.log"]
name = "Log"
description = "Schreibt eine Zeile in die Konsole. Mit {name}-Platzhaltern setzt du verbundene Werte ein."

[blocks."core.throw"]
name = "Fehler auslösen"
description = "Beendet diesen Ablauf mit einem Fehler. In einer Try-Zone läuft dann ihr Fehler-Ausgang."

[blocks."core.on_error"]
name = "Bei Fehler"
description = "Läuft, wenn ein Block außerhalb jeder Try-Zone fehlschlägt. Gut zum Protokollieren oder Melden von Fehlern."

[blocks."core.on_signal"]
name = "Bei Signal"
description = "Läuft, wenn „Signal senden“ ein Signal mit demselben Namen schickt, aus jedem Arbeitsbereich."

[blocks."core.on_start"]
name = "Bot gestartet"
description = "Läuft einmal, wenn der Bot gestartet und verbunden ist."

[blocks."core.emit_signal"]
name = "Signal senden"
description = "Startet jeden „Bei Signal“-Block mit demselben Namen. Ersetzt Emitter/Receiver."

[blocks."core.for_each"]
name = "Für jedes"
description = "Führt „Jedes“ einmal für jedes Element einer Liste aus, dann „Fertig“."

[blocks."core.if"]
name = "Wenn"
description = "Geht je nach Bedingung bei Wahr oder Falsch weiter."

[blocks."core.repeat"]
name = "Wiederholen"
description = "Führt „Jedes“ mehrmals aus, dann „Fertig“."

[blocks."core.switch"]
name = "Verzweigung"
description = "Geht an dem Ausgang weiter, dessen Fall zum Wert passt. Ein Fall pro Zeile; „Sonst“ läuft, wenn keiner passt."

[blocks."core.wait"]
name = "Warten"
description = "Pausiert diesen Zweig für einige Sekunden und geht dann weiter."

[blocks."core.get_property"]
name = "Eigenschaft lesen"
description = "Liest eine Eigenschaft aus einem Objekt, etwa `username` aus einem Nutzer. Tiefere mit Punkten: `guild.name`."

[blocks."core.list_tools"]
name = "Listen-Werkzeuge"
description = "Liest oder ändert eine Liste: Länge, erstes/letztes, enthält, hinzufügen, entfernen, verbinden, sortieren, zufällig …"

[blocks."core.make_list"]
name = "Liste bilden"
description = "Packt verbundene Werte in der Reihenfolge der Verbindungen in eine Liste. Unten getippter Text fügt auch Elemente hinzu (eins pro Zeile)."

[blocks."core.compare"]
name = "Vergleichen"
description = "Vergleicht zwei Werte und gibt wahr oder falsch."

[blocks."core.logic"]
name = "Und / Oder / Nicht"
description = "Verknüpft Ja/Nein-Werte."

[blocks."core.math"]
name = "Mathe"
description = "Rechnet mit zwei Zahlen."

[blocks."core.random_number"]
name = "Zufallszahl"
description = "Eine Zufallszahl zwischen Min und Max (beide eingeschlossen)."

[blocks."core.join_text"]
name = "Texte verbinden"
description = "Verbindet mehrere Texte zu einem, mit optionalem Trennzeichen."

[blocks."core.text"]
name = "Text"
description = "Ein Stück Text. Mit {name}-Platzhaltern setzt du verbundene Werte ein."

[blocks."core.text_tools"]
name = "Text-Werkzeuge"
description = "Ändert oder prüft Text: Groß-/Kleinschreibung, trimmen, enthält, ersetzen, teilen, Länge …"

[blocks."core.get_variable"]
name = "Variable lesen"
description = "Liest einen mit „Variable setzen“ gemerkten Wert."

[blocks."core.set_variable"]
name = "Variable setzen"
description = "Merkt sich einen Wert unter einem Namen, bis der Bot stoppt. Mit gespeicherten Daten bleibt er auch nach Neustarts."

[blocks."core.http_request"]
name = "Web-Anfrage"
description = "Ruft eine Webadresse (API) auf und gibt die Antwort zurück. Schlägt bei HTTP-Fehlern fehl, also leg ihn in eine Try-Zone."
