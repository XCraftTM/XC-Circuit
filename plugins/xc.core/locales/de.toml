"The canvas" = "Die Arbeitsfläche"
"Bots are built here from blocks. Drag empty space to move around and use the mouse wheel to zoom." = "Hier baust du Bots aus Blöcken. Zieh an einer leeren Stelle, um dich zu bewegen, und zoome mit dem Mausrad."
"Blocks and wires" = "Blöcke und Verbindungen"
"Bot Started runs once when the bot starts. The green wire hands over to Log, which writes a line to the Console. Green wires decide the order things happen in." = "„Bot gestartet“ läuft einmal, wenn der Bot startet. Die grüne Verbindung übergibt an „Log“, der eine Zeile in die Konsole schreibt. Grüne Verbindungen bestimmen die Reihenfolge."
"Add a block" = "Einen Block hinzufügen"
"Click Add block in the canvas toolbar (or right-click empty canvas, or press Space), type Math and click it." = "Klicke in der Leiste der Arbeitsfläche auf „Block hinzufügen“ (oder Rechtsklick auf eine leere Stelle oder Leertaste), tippe Mathe und klicke darauf."
