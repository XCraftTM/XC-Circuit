"Into XC Circuit's own folder, no password needed. From nodejs.org, checked against its published checksum." = "In den eigenen Ordner von XC Circuit, ohne Passwort. Von nodejs.org, mit der veröffentlichten Prüfsumme geprüft."
"Or install it with your package manager. Distribution packages are often older than Node.js 22, so check the version." = "Oder installiere es mit deiner Paketverwaltung. Pakete der Distribution sind oft älter als Node.js 22, also prüfe die Version."
