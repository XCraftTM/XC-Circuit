"Allow databases given on blocks" = "Auf Blöcken angegebene Datenbanken erlauben"
"On: a database block set to Given here connects to the host, user and password it's given (from a command's options, say). Anyone who can use such a command can make the bot connect where they say, so only turn it on for commands you trust them with." = "An: Ein Datenbank-Block, der auf Given here steht, verbindet sich mit dem Host, Benutzer und Passwort, die er bekommt (etwa aus den Optionen eines Befehls). Wer einen solchen Befehl benutzen kann, kann den Bot verbinden lassen, wohin er will. Schalte es also nur für Befehle ein, bei denen du den Nutzern das zutraust."
