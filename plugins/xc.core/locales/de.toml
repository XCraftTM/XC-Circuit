"The bot is starting …" = "Der Bot startet …"
"Done!" = "Geschafft!"
"Open the DemoBot example" = "Beispiel DemoBot öffnen"
"Start a new project" = "Neues Projekt beginnen"
"Back to my project" = "Zurück zu meinem Projekt"
"Do it for me" = "Mach es für mich"
"Welcome to the tour" = "Willkommen zur Tour"
"In a few steps you'll add a block, connect it and run a small bot. This is a practice project, so nothing of yours changes. You can skip the tour any time." = "In ein paar Schritten fügst du einen Block hinzu, verbindest ihn und startest einen kleinen Bot. Das ist ein Übungsprojekt, also ändert sich nichts von dir. Du kannst die Tour jederzeit überspringen."
"The canvas" = "Die Arbeitsfläche"
"Bots are built here from blocks. Drag empty space to move around and use the mouse wheel to zoom." = "Hier baust du Bots aus Blöcken. Zieh an einer leeren Stelle, um dich zu bewegen, und zoome mit dem Mausrad."
"Blocks and wires" = "Blöcke und Verbindungen"
"Bot Started runs once when the bot starts. The green wire hands over to Log, which writes a line to the Console. Green wires decide the order things happen in." = "„Bot gestartet“ läuft einmal, wenn der Bot startet. Die grüne Verbindung übergibt an „Log“, der eine Zeile in die Konsole schreibt. Grüne Verbindungen bestimmen die Reihenfolge."
"Add a block" = "Einen Block hinzufügen"
"Click Add block in the canvas toolbar (or right-click empty canvas, or press Space), type Math and click it." = "Klicke in der Leiste der Arbeitsfläche auf „Block hinzufügen“ (oder Rechtsklick auf eine leere Stelle oder Leertaste), tippe Mathe und klicke darauf."
"Waiting for a Math block …" = "Warte auf einen Mathe-Block …"
"Connect them" = "Verbinde sie"
"Drag from the Result pin on the right of Math to the Message pin on the left of Log. Colored wires carry values." = "Zieh vom Anschluss „Ergebnis“ rechts an Mathe zum Anschluss „Nachricht“ links an Log. Farbige Verbindungen transportieren Werte."
"Waiting for the wire …" = "Warte auf die Verbindung …"
"Change its settings" = "Ändere seine Einstellungen"
"Click the Math block: its settings show in the Inspector. Set A to 2 and B to 3. You can also type right on the block." = "Klicke auf den Mathe-Block: Seine Einstellungen erscheinen im Inspektor. Setze A auf 2 und B auf 3. Du kannst auch direkt auf dem Block tippen."
"Waiting for A = 2 and B = 3 …" = "Warte auf A = 2 und B = 3 …"
"Run it" = "Starte ihn"
"Press Run (or F5). XC Circuit starts the bot, Bot Started fires and the blocks light up as they run." = "Drück auf Starten (oder F5). XC Circuit startet den Bot, „Bot gestartet“ löst aus und die Blöcke leuchten beim Ausführen auf."
"Waiting for the bot to say something …" = "Warte darauf, dass der Bot etwas sagt …"
"The Console" = "Die Konsole"
"Your bot wrote 5, the answer from Math. Everything a bot says shows up here, errors too, with a link to the block that said it." = "Dein Bot hat 5 geschrieben, das Ergebnis von Mathe. Alles, was ein Bot sagt, erscheint hier, auch Fehler, mit einem Link zum Block, von dem es kam."
"Find anything" = "Alles finden"
"Search here (or press Ctrl+P) for any command, workspace or block. Settings are behind the gear in the activity bar, or Ctrl+,." = "Such hier (oder mit Strg+P) nach Befehlen, Arbeitsbereichen und Blöcken. Die Einstellungen findest du hinter dem Zahnrad in der Aktivitätsleiste oder mit Strg+,."
"That's the basics!" = "Das sind die Grundlagen!"
"Discord bots work the same way, with events like Slash Command and actions like Send Message. Where to next?" = "Discord-Bots funktionieren genauso, mit Ereignissen wie „Slash-Befehl“ und Aktionen wie „Nachricht senden“. Wie geht's weiter?"
