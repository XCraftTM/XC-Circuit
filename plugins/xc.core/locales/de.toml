"Waiting for A = 2 and B = 3 …" = "Warte auf A = 2 und B = 3 …"
"Run it" = "Starte ihn"
"Press Run (or F5). XC Circuit starts the bot, Bot Started fires and the blocks light up as they run." = "Drück auf Starten (oder F5). XC Circuit startet den Bot, „Bot gestartet“ löst aus und die Blöcke leuchten beim Ausführen auf."
"Waiting for the bot to say something …" = "Warte darauf, dass der Bot etwas sagt …"
"The Console" = "Die Konsole"
