"XC Circuit didn't answer for {seconds} s: it was stuck {phase}. This is kept in freezes.log in the app's data folder." = "XC Circuit hat {seconds} s lang nicht reagiert: Es hing {phase}. Das steht auch in freezes.log im Datenordner der App."
"Last time, XC Circuit stopped answering and was closed while it was stuck {phase}. freezes.log in the app's data folder says more." = "Beim letzten Mal hat XC Circuit nicht mehr reagiert und wurde geschlossen, während es {phase} hing. Mehr dazu steht in freezes.log im Datenordner der App."
"No graphics card driver could be used, so the app is drawn in software, which is slower. Updating the graphics driver usually helps; Settings › Window › Graphics can try another way to draw." = "Es konnte kein Grafikkartentreiber verwendet werden, daher wird die App in Software gezeichnet, was langsamer ist. Ein Update des Grafiktreibers hilft meist; Einstellungen › Fenster › Grafik kann eine andere Zeichenart versuchen."
"No graphics card driver could be used, so the app is drawn in software, which is slower: lighter drawing is on (Settings › Window). Updating the graphics driver usually helps; Settings › Window › Graphics can try another way to draw." = "Es konnte kein Grafikkartentreiber verwendet werden, daher wird die App in Software gezeichnet, was langsamer ist: Leichteres Zeichnen ist an (Einstellungen › Fenster). Ein Update des Grafiktreibers hilft meist; Einstellungen › Fenster › Grafik kann eine andere Zeichenart versuchen."
"Lighter drawing" = "Leichteres Zeichnen"
"How the app draws, from its next start. Automatic tries DirectX 12 or Vulkan first; on an older computer, OpenGL or Older OpenGL can draw with the graphics card where those can't." = "Wie die App zeichnet, ab dem nächsten Start. Automatisch versucht zuerst DirectX 12 oder Vulkan; auf einem älteren Computer können OpenGL oder Älteres OpenGL mit der Grafikkarte zeichnen, wo diese es nicht können."
"Graphics" = "Grafik"
"Automatic" = "Automatisch"
"OpenGL" = "OpenGL"
"Older OpenGL" = "Älteres OpenGL"
"Now: {graphics}." = "Gerade: {graphics}."
"The app draws with {graphics} when it starts again." = "Die App zeichnet beim nächsten Start mit {graphics}."
"Couldn't keep the graphics choice: {error}" = "Die Grafikwahl konnte nicht gespeichert werden: {error}"
"XC Circuit" = "XC Circuit"
"Updates the blocks too, downloads {size} MB and installs it when XC Circuit closes, then opens it again. You're asked about unsaved changes first." = "Aktualisiert auch die Blöcke, lädt {size} MB herunter, installiert es beim Schließen von XC Circuit und öffnet es dann wieder. Nach ungespeicherten Änderungen wirst du vorher gefragt."
"For older computers: tick what to leave out, so there's less to draw." = "Für ältere Computer: Hake an, was wegfallen soll, damit weniger zu zeichnen ist."
"No shadows" = "Keine Schatten"
"Windows, menus and blocks without the shadow under them." = "Fenster, Menüs und Blöcke ohne den Schatten darunter."
"No fading" = "Kein Ein- und Ausblenden"
"Menus, tooltips and panels appear and go at once instead of fading." = "Menüs, Tooltips und Bereiche erscheinen und verschwinden sofort, statt zu überblenden."
"Still glows" = "Ruhiges Leuchten"
"Empty required fields and blocks that just ran glow without pulsing, so the app doesn't draw itself again 30 times a second for them." = "Leere Pflichtfelder und gerade gelaufene Blöcke leuchten, ohne zu pulsieren, damit sich die App dafür nicht 30-mal pro Sekunde neu zeichnet."
"Simpler edges" = "Einfachere Kanten"
"Edges without their soft fringe: about half as many triangles to draw, a little more jagged." = "Kanten ohne ihren weichen Rand: etwa halb so viele Dreiecke zu zeichnen, etwas kantiger."
"All without a graphics card" = "Alles ohne Grafikkarte"
"When the app has to draw in software (no graphics card driver it could use), all of them are left out, whatever is ticked." = "Wenn die App in Software zeichnen muss (kein nutzbarer Grafikkartentreiber), fällt alles davon weg, egal was angehakt ist."
"All on now: the app draws without a graphics card." = "Gerade alles an: Die App zeichnet ohne Grafikkarte."
"`{field}` uses #{block}, but this workspace has no block #{block}" = "`{field}` verwendet #{block}, aber dieser Arbeitsbereich hat keinen Block #{block}"
"Modal Submitted gives each answer as an output of its own: {ids}" = "Modal Submitted gibt jede Antwort als eigenen Ausgang: {ids}"
"The project couldn't be saved, so XC Circuit stays open: your changes are still here. Save again, or close without saving." = "Das Projekt konnte nicht gespeichert werden, daher bleibt XC Circuit offen: Deine Änderungen sind noch da. Speichere noch einmal oder schließe ohne zu speichern."
"Folds the options used less often away; those in use stay." = "Klappt die seltener genutzten Optionen weg; die genutzten bleiben."
"Shows the options used less often. Those in use (connected, or set to something) show anyway." = "Zeigt die seltener genutzten Optionen. Die genutzten (verbunden oder auf etwas gesetzt) werden sowieso gezeigt."
"Fewer options" = "Weniger Optionen"
"1 more option" = "1 weitere Option"
"{count} more options" = "{count} weitere Optionen"
"More options" = "Weitere Optionen"
"Accessibility" = "Barrierefreiheit"
"Screen readers and the touch keyboard can see what's in the window. If XC Circuit stops answering while a program that reads windows runs (some password managers and writing helpers), try turning this off." = "Bildschirmleser und die Bildschirmtastatur können sehen, was im Fenster ist. Wenn XC Circuit nicht mehr reagiert, während ein Programm läuft, das Fenster ausliest (manche Passwortmanager und Schreibhilfen), schalte dies testweise aus."
