id          = "xc.core"
name        = "Circuit Core"
version     = "1.0.3"
author      = "XC Team"
description = "Mode-independent blocks (flow, text, math, logic, stored data, databases, debug), the icon set and the built-in themes."
icon        = "icons/block.svg"

[engines]
circuit = "^1.0"
# The database blocks need the runtime of XC Circuit 0.1.3 (ctx.db).
app = "0.1.3"

[contributes]
blocks = ["blocks/**/*.{js,cjs,mjs,ts}"]
themes = ["themes/*.toml"]
icons  = ["icons/*.{svg,png}"]
locales = ["locales/*.toml"]
