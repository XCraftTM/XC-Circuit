id          = "xc.core"
name        = "Circuit Core"
version     = "1.0.112"
author      = "XC Team"
description = "Mode-independent blocks (flow, text, math, logic, stored data, databases, debug), the icon set and the built-in themes."
icon        = "icons/block.svg"

[engines]
circuit = "^1.0"
# The interface's translations here are those of XC Circuit 0.3.0 (Remote instead of Server, Git, Host, live sessions): an older app would lose its German texts for what was renamed.
app = "0.3.0"

[contributes]
blocks = ["blocks/**/*.{js,cjs,mjs,ts}"]
themes = ["themes/*.toml"]
icons  = ["icons/*.{svg,png}"]
locales = ["locales/*.toml"]
botSettings = ["settings/*.toml"]
