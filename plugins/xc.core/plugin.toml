id          = "xc.core"
name        = "Circuit Core"
version     = "1.0.46"
author      = "XC Team"
description = "Mode-independent blocks (flow, text, math, logic, stored data, databases, debug), the icon set and the built-in themes."
icon        = "icons/block.svg"

[engines]
circuit = "^1.0"
# The database and canvas blocks need the runtime and editor of XC Circuit 0.1.3 (ctx.db, ctx.asset, ctx.timers, ctx.id, ctx.runtime.secret, the canvas field, botSettings).
app = "0.1.3"

[contributes]
blocks = ["blocks/**/*.{js,cjs,mjs,ts}"]
themes = ["themes/*.toml"]
icons  = ["icons/*.{svg,png}"]
locales = ["locales/*.toml"]
botSettings = ["settings/*.toml"]
