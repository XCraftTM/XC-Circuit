id          = "xc.stats"
name        = "Project Stats"
version     = "1.0.0"
author      = "XC Team"
description = "An example native Rust plugin: a Project Stats panel, a summary command and a check for blocks that aren't connected."

[engines]
circuit = "^1.0"

# The compiled library: xc_stats.dll on Windows, libxc_stats.so on Linux.
# Build it with `cargo build -p xc-stats` (use --release for a release editor).
[native]
library = "xc_stats"
