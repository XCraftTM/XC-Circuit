[strings]
"AI agents (MCP)" = "KI-Agenten (MCP)"
"AI agents" = "KI-Agenten"
"AI agents such as Claude can read your project, add, change and connect blocks, see problems and the Console, and start or stop the bot. Every change shows here at once and can be undone. The tools never give them the bot's token, and the Console hides it; the bot they build and run uses it, as every bot does." = "KI-Agenten wie Claude können dein Projekt lesen, Blöcke hinzufügen, ändern und verbinden, Probleme und die Konsole sehen und den Bot starten oder stoppen. Jede Änderung erscheint hier sofort und lässt sich rückgängig machen. Die Werkzeuge geben ihnen den Token des Bots nie, und die Konsole verbirgt ihn; der Bot, den sie bauen und starten, verwendet ihn, wie jeder Bot."
