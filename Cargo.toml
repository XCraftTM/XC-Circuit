[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.6"
edition = "2024"
rust-version = "1.95"
authors = ["XCraftTM"]
# Source-available, see LICENSE; not published to crates.io.
license-file = "LICENSE"
publish = false

[workspace.dependencies]
circuit-core = { path = "crates/circuit-core" }
circuit-plugins = { path = "crates/circuit-plugins" }
circuit-runner = { path = "crates/circuit-runner" }

anyhow = "1"
dirs = "7"
glob = "0.3"
indexmap = { version = "2", features = ["serde"] }
keyring = "4"
open = "5"
rfd = "0.17"
rquickjs = "0.14"
serde = { version = "1", features = ["derive"] }
# preserve_order keeps fields, outputs and values in the order block files declare them.
serde_json = { version = "1", features = ["preserve_order"] }
toml = { version = "1", features = ["preserve_order"] }

# eframe's default features without `accesskit`: no bridge to screen readers
# (Windows UI Automation and the like), which other programs reading the
# window could make hang. winit's own defaults, which eframe's bring along,
# come from circuit-editor's Linux dependency on it.
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "links", "system_fonts", "wayland", "wgpu", "x11", "persistence", "glow"] }
egui_extras = { version = "0.37", features = ["file", "svg", "image"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev.package."*"]
opt-level = 2
