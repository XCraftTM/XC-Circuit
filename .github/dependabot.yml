# Dependency update pull requests. Security fixes come on their own as soon as
# they're published (Settings › Advanced Security); these are the regular
# updates, bundled into one pull request per ecosystem each week.
version: 2
updates:
  # The Rust workspace: the editor, runner, plugins and xc-circuit-plugin.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # egui, eframe, egui_extras and egui_dock only work in matching
      # versions, so they come together. Such an update can wait until
      # egui_dock supports the new egui.
      egui:
        patterns: ["egui", "egui_*", "eframe", "epaint", "emath", "ecolor"]
      rust:
        update-types: [minor, patch]
    # egui 0.37 waits for egui_dock to support it (anhosh/egui_dock#354).
    # egui_dock's own updates still come: when its new version needs egui
    # 0.37, that pull request is the sign to remove these lines.
    ignore:
      - dependency-name: "egui"
        versions: [">= 0.37"]
      - dependency-name: "eframe"
        versions: [">= 0.37"]
      - dependency-name: "egui_extras"
        versions: [">= 0.37"]
      - dependency-name: "epaint"
        versions: [">= 0.37"]
      - dependency-name: "emath"
        versions: [">= 0.37"]
      - dependency-name: "ecolor"
        versions: [">= 0.37"]

  # The website (VitePress).
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      website:
        patterns: ["*"]

  # Actions used by the build and website workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
