# Dependency update pull requests. Security fixes come on their own as soon as
# they're published (Settings › Advanced Security); these are the regular
# updates, bundled into one pull request per ecosystem each week.
version: 2
updates:
  # The Rust workspace: the editor, runner, plugins and xc-circuit-plugin.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # egui, eframe and egui_extras only work in matching versions, so they
      # come together. (Native plugins are built with the editor's egui, so
      # the plugin crate's egui comes with them.)
      egui:
        patterns: ["egui", "egui_*", "eframe", "epaint", "emath", "ecolor"]
      rust:
        update-types: [minor, patch]

  # The website (VitePress).
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      website:
        patterns: ["*"]

  # Actions used by the build and website workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
