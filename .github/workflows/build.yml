name: Build

# Started by hand (Actions › Build › Run workflow, or `gh workflow run build.yml`),
# so pushes don't use up Actions minutes. A version tag (v1.2.0) builds and
# publishes a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            target: x86_64-pc-windows-msvc
            exe: xc-circuit.exe
            native: xc_stats.dll
          # 22.04 keeps the Linux build compatible with older distributions (glibc).
          - os: ubuntu-22.04
            name: linux-x64
            target: x86_64-unknown-linux-gnu
            exe: xc-circuit
            native: libxc_stats.so
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # For the third-party notices.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: cargo test --workspace

      - name: Runtime tests
        run: |
          node runtime/test/smoke.js
          node runtime/test/library.js
          node runtime/test/template.js
          node runtime/test/helpers.js
          node runtime/test/discord_blocks.js
          node runtime/test/fluxer_blocks.js
          node runtime/test/fluxer_run.js
          node runtime/test/store.js
          node runtime/test/backups.js < /dev/null

      # Native plugins are built together with the editor so they share one build of egui.
      - name: Release build
        run: cargo plugin xc-stats --release

      # The program finds plugins/ and examples/ next to itself. The licences
      # go along: the app's own, the crates built into it, and the font's.
      - name: Package
        shell: bash
        run: |
          out="XC-Circuit-${{ matrix.name }}"
          mkdir -p "$out/licenses"
          cp "target/release/${{ matrix.exe }}" "$out/"
          cp -r plugins examples README.md LICENSE "$out/"
          cp "target/release/${{ matrix.native }}" "$out/plugins/xc.stats/"
          python tools/third_party_notices.py "$out/THIRD-PARTY-NOTICES.txt" "${{ matrix.target }}"
          cp crates/circuit-editor/assets/fonts/LICENCE.txt "$out/licenses/Ubuntu-Font-Licence.txt"
          rm -rf "$out"/examples/*/.circuit
          # Only what users need: no plugin sources, tools or packages.
          for dir in "$out"/plugins/*/; do
            if [ -f "$dir/Cargo.toml" ]; then rm -rf "$dir/src" "$dir/Cargo.toml" "$dir/Cargo.lock" "$dir/build.rs"; fi
            rm -rf "$dir/tools" "$dir/node_modules" "$dir/target"
          done
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$out.zip" "$out" > /dev/null
          else
            tar -czf "$out.tar.gz" "$out"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: XC-Circuit-${{ matrix.name }}
          path: XC-Circuit-${{ matrix.name }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" XC-Circuit-* --repo "${{ github.repository }}" --title "XC Circuit ${{ github.ref_name }}" --generate-notes
