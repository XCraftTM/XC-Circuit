name: Build

# Started by hand (Actions › Build › Run workflow, or `gh workflow run build.yml`),
# so pushes don't use up Actions minutes. A version tag (v0.1.0) builds and
# makes a draft release, published by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default; only the release job may publish.
permissions:
  contents: read

jobs:
  # Which systems to build for. Windows ARM64 is cross-compiled on the x64
  # runner (tests can't run there). Linux ARM64 needs GitHub's ARM runners,
  # which are free for public repositories, so it's built once the repository is public.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        env:
          PUBLIC: ${{ !github.event.repository.private }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          entries='{"os":"windows-latest","name":"windows-x64","target":"x86_64-pc-windows-msvc","arch":"x64","exe":"xc-circuit.exe","test":true}'
          entries+=',{"os":"windows-latest","name":"windows-arm64","target":"aarch64-pc-windows-msvc","arch":"arm64","exe":"xc-circuit.exe","test":false}'
          # 22.04 keeps the Linux builds compatible with older distributions (glibc).
          entries+=',{"os":"ubuntu-22.04","name":"linux-x64","target":"x86_64-unknown-linux-gnu","arch":"x86_64","exe":"xc-circuit","test":true}'
          if [ "$PUBLIC" = "true" ]; then
            entries+=',{"os":"ubuntu-22.04-arm","name":"linux-arm64","target":"aarch64-unknown-linux-gnu","arch":"aarch64","exe":"xc-circuit","test":true}'
          fi
          echo "matrix={\"include\":[$entries]}" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libdbus-1-dev libasound2-dev pkg-config rpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # For the third-party notices.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # A version tag's commit was already tested by the Checks (on Linux,
      # Windows and Linux ARM64), so a release build skips this; the release
      # waits for those Checks instead. A build started by hand still tests.
      - name: Tests
        if: matrix.test && !startsWith(github.ref, 'refs/tags/')
        run: cargo test --workspace

      - name: Runtime tests
        if: matrix.test && !startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          node runtime/test/smoke.js
          node runtime/test/library.js
          node runtime/test/template.js
          node runtime/test/helpers.js
          node runtime/test/discord_blocks.js
          node runtime/test/discord_events.js
          node runtime/test/discord_actions.js
          node runtime/test/discord_music.js
          node runtime/test/fluxer_blocks.js
          node runtime/test/fluxer_run.js
          node runtime/test/fluxer_more.js
          node runtime/test/store.js
          node runtime/test/conversions.js
          node runtime/test/permissions.js
          node runtime/test/discord_forms.js
          node runtime/test/backups.js < /dev/null
          node runtime/test/databases.js
          node runtime/test/canvas.js
          node runtime/test/timers.js
          node runtime/test/alerts.js
          node runtime/test/files.js
          node runtime/test/web_guard.js
          node runtime/test/server_tools.js
          node runtime/test/captcha.js
          node runtime/test/transcript.js

      - name: Release build
        run: cargo build -p circuit-editor --release --target ${{ matrix.target }}

      # The program finds plugins/ and examples/ next to itself. The licences
      # go along: the app's own, the crates built into it, and the font's.
      - name: Package
        shell: bash
        run: |
          out="XC-Circuit-${{ matrix.name }}"
          bin="target/${{ matrix.target }}/release"
          mkdir -p "$out/licenses" dist
          cp "$bin/${{ matrix.exe }}" "$out/"
          cp -r plugins examples README.md LICENSE CHANGELOG.md "$out/"
          python tools/third_party_notices.py "$out/THIRD-PARTY-NOTICES.txt" "${{ matrix.target }}"
          cp crates/circuit-editor/assets/fonts/LICENCE.txt "$out/licenses/Ubuntu-Font-Licence.txt"
          rm -rf "$out"/examples/*/.circuit
          # Only what users need: no plugin sources, tools or packages.
          for dir in "$out"/plugins/*/; do
            if [ -f "$dir/Cargo.toml" ]; then rm -rf "$dir/src" "$dir/Cargo.toml" "$dir/Cargo.lock" "$dir/build.rs"; fi
            rm -rf "$dir/tools" "$dir/node_modules" "$dir/target"
          done
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "dist/XC-Circuit-$VERSION-${{ matrix.name }}.zip" "$out" > /dev/null
          else
            tar -czf "dist/XC-Circuit-$VERSION-${{ matrix.name }}.tar.gz" "$out"
          fi

      # Setup.exe, for x64 and ARM64 (Inno Setup).
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$env:VERSION" "/DArch=${{ matrix.arch }}" "/DSourceDir=$PWD\XC-Circuit-${{ matrix.name }}" "/DOutputDir=$PWD\dist" packaging\windows\xc-circuit.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The update from inside the app: the Setup runs silently with the app's
      # arguments, installs, and opens XC Circuit again (/restart=1).
      - name: Try the update
        if: runner.os == 'Windows' && matrix.arch == 'x64'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\*-setup.exe | Select-Object -First 1
          # Not Start-Process -Wait: that also waits for XC Circuit, which the
          # Setup opens and which keeps running.
          $p = Start-Process $setup.FullName -ArgumentList '/SILENT','/SUPPRESSMSGBOXES','/NORESTART','/CLOSEAPPLICATIONS','/restart=1','/CURRENTUSER' -PassThru
          if (-not $p.WaitForExit(180000)) { throw "The Setup didn't finish in 3 minutes" }
          if ($p.ExitCode -ne 0) { throw "The Setup ended with $($p.ExitCode)" }
          $exe = "$env:LOCALAPPDATA\Programs\XC Circuit\xc-circuit.exe"
          if (-not (Test-Path $exe)) { throw "Not installed at $exe" }
          $running = $null
          for ($i = 0; $i -lt 300 -and -not $running; $i++) {
            Start-Sleep -Milliseconds 100
            $running = Get-Process xc-circuit -ErrorAction SilentlyContinue
          }
          if (-not $running) { throw "XC Circuit didn't open again after the update" }
          Write-Host "Installed and opened again: $($running.Path)"
          $running | Stop-Process -Force

      # .deb, .rpm and .AppImage.
      - name: Linux packages
        if: runner.os == 'Linux'
        env:
          # To fetch appimagetool signed in (read-only; see the script).
          GH_TOKEN: ${{ github.token }}
        run: bash packaging/linux/build-packages.sh "XC-Circuit-${{ matrix.name }}" "$VERSION" "${{ matrix.arch }}" dist

      - uses: actions/upload-artifact@v7
        with:
          name: XC-Circuit-${{ matrix.name }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      # The tests ran in the Checks for this commit (pushed to main before
      # the tag); no release unless they passed. They usually finish before
      # the builds do.
      - name: Checks passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            run=$(gh run list --repo "${{ github.repository }}" --workflow checks.yml --commit "$GITHUB_SHA" --event push --limit 1 --json status,conclusion,url --jq '.[0] // empty')
            if [ -z "$run" ]; then
              echo "No Checks for $GITHUB_SHA: push the commit to main before tagging it."; exit 1
            fi
            status=$(echo "$run" | jq -r .status); conclusion=$(echo "$run" | jq -r .conclusion)
            if [ "$status" = "completed" ]; then
              echo "Checks: $conclusion ($(echo "$run" | jq -r .url))"
              [ "$conclusion" = "success" ] && exit 0
              echo "The Checks for this commit didn't pass (if they were cancelled by a newer push, run them again for this commit)."; exit 1
            fi
            sleep 30
          done
          echo "The Checks didn't finish in 30 minutes."; exit 1
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # The notes are the version's part of CHANGELOG.md.
      - name: Release notes
        run: |
          awk -v v="${{ needs.plan.outputs.version }}" '
            /^## / { if (found) exit; if (index($0, v)) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          echo "" >> notes.md
          echo "Downloads: Windows Setup.exe (x64, ARM64) or .zip, Linux .AppImage, .deb, .rpm or .tar.gz. See the [download page](https://xcrafttm.github.io/XC-Circuit/download)." >> notes.md
      # A draft: look it over on the Releases page, then press Publish.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --draft --repo "${{ github.repository }}" --title "XC Circuit ${{ github.ref_name }} (Early Access)" --notes-file notes.md
