# Tests every pull request (Dependabot's too) and every push to main, so a
# change that breaks something shows a red ✗ before it's merged. On Linux,
# Windows and Linux ARM64: a version tag's release build doesn't test again,
# it waits for these instead (see build.yml).
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libdbus-1-dev libasound2-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Tests
        run: cargo test --workspace

      # Clippy and the plugin versions are the same everywhere: once is enough.
      - name: Clippy
        if: matrix.os == 'ubuntu-22.04'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - uses: actions/setup-python@v7
        if: matrix.os == 'ubuntu-22.04'
        with:
          python-version: "3.12"

      # A plugin whose files changed needs a higher version, or apps won't
      # notice the update (see tools/plugin_updates.py).
      - name: Plugin versions
        if: matrix.os == 'ubuntu-22.04'
        run: python tools/plugin_updates.py check

      - name: Runtime tests
        shell: bash
        run: |
          node runtime/test/smoke.js
          node runtime/test/library.js
          node runtime/test/template.js
          node runtime/test/helpers.js
          node runtime/test/discord_blocks.js
          node runtime/test/discord_events.js
          node runtime/test/discord_actions.js
          node runtime/test/discord_music.js
          node runtime/test/fluxer_blocks.js
          node runtime/test/fluxer_run.js
          node runtime/test/fluxer_more.js
          node runtime/test/store.js
          node runtime/test/conversions.js
          node runtime/test/permissions.js
          node runtime/test/discord_forms.js
          node runtime/test/backups.js < /dev/null
          node runtime/test/databases.js
          node runtime/test/canvas.js
          node runtime/test/timers.js
          node runtime/test/alerts.js
          node runtime/test/files.js
          node runtime/test/server_tools.js
          node runtime/test/captcha.js
          node runtime/test/transcript.js

  # The database blocks against real servers: MariaDB, PostgreSQL and
  # MongoDB (SQLite runs with the other runtime tests). Linux runners only
  # have service containers, so this runs on Linux; on 22.04, because
  # MongoDB 8 doesn't start on the newer kernel of ubuntu-latest
  # (https://jira.mongodb.org/browse/SERVER-121912).
  databases:
    name: Databases and pictures
    runs-on: ubuntu-22.04
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: test
          MARIADB_DATABASE: test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mongodb:
        image: mongo:8
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - name: Kernel
        run: uname -r
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # The versions bots get (DATABASE_DRIVERS in crates/circuit-runner/src/bundle.rs).
      - name: Database drivers
        run: |
          mkdir -p "$RUNNER_TEMP/db-deps"
          cd "$RUNNER_TEMP/db-deps"
          npm init -y > /dev/null
          npm install --no-audit --no-fund mysql2@^3.24.6 pg@^8.23.1 mongodb@^7.8.0 @napi-rs/canvas@^1.1.0 ssh2@^1.17.0 better-discord-transcripts@2.0.0 discord.js@^14.28.0
      - name: Database tests
        env:
          XC_TEST_DEPS: ${{ runner.temp }}/db-deps
          XC_TEST_MARIADB: mysql://root:test@127.0.0.1:3306/test
          XC_TEST_POSTGRES: postgres://postgres:test@127.0.0.1:5432/test
          XC_TEST_MONGODB: mongodb://127.0.0.1:27017/test
        run: node runtime/test/databases.js
      # Build Canvas, with the package bots get (its requires.dependencies).
      - name: Picture tests
        env:
          XC_TEST_DEPS: ${{ runner.temp }}/db-deps
        run: node runtime/test/canvas.js
      # Server tools with ssh2 (SSH against a stand-in server).
      - name: Server tools tests
        env:
          XC_TEST_DEPS: ${{ runner.temp }}/db-deps
        run: node runtime/test/server_tools.js
      - name: Captcha tests
        env:
          XC_TEST_DEPS: ${{ runner.temp }}/db-deps
        run: node runtime/test/captcha.js
      - name: Transcript tests
        env:
          XC_TEST_DEPS: ${{ runner.temp }}/db-deps
        run: node runtime/test/transcript.js

  website:
    name: Website builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install
        working-directory: docs
        run: npm ci
      - name: Build
        working-directory: docs
        run: npm run build
