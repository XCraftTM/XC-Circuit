# Builds the XC Circuit Host's image (host/) and puts it in the GitHub
# Container Registry: ghcr.io/<owner>/xc-circuit-host
#
# Runs for the `host` branch (which holds only the Host, so the image can be
# there before the app that uses it is released), for a tag host-v1.2.3, and
# by hand. The app's own releases are build.yml's.
name: Host image

on:
  push:
    branches: [host]
    tags: ["host-v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Test, build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Tests
        run: node host/test/host.js

      - name: Build for this machine
        run: docker build -f host/Dockerfile -t xc-circuit-host:test .
      - name: A relay starts and says what it is
        run: |
          docker run -d --name relay -e XC_HOST_MODE=relay -p 127.0.0.1:7421:7421 xc-circuit-host:test
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:7421/status && break || sleep 1; done
          curl -fsS http://127.0.0.1:7421/status | grep '"mode":"relay"'
          docker inspect --format '{{.Config.User}}' relay | grep -x node
          docker rm -f relay
      - name: Full mode keeps its data in the volume
        run: |
          docker run -d --name full -v host-data:/data -p 127.0.0.1:7421:7421 xc-circuit-host:test
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:7421/status && break || sleep 1; done
          curl -fsS http://127.0.0.1:7421/status | grep '"projects"'
          docker logs full 2>&1 | grep 'Pair the first one'
          docker exec full test -f /data/host.sqlite
          docker exec full git --version
          docker rm -f full
      - name: Full mode refuses to start without its data folder
        run: |
          if docker run --rm -e XC_HOST_DATA=/nowhere xc-circuit-host:test > out.txt 2>&1; then echo "it started"; exit 1; fi
          grep "data folder" out.txt

      - name: Names for the image
        id: names
        run: |
          image="ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/xc-circuit-host"
          tags="-t $image:latest -t $image:sha-${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/host-v* ]]; then tags="$tags -t $image:${GITHUB_REF_NAME#host-v}"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to the registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build for x64 and ARM, and publish
        run: |
          docker buildx build -f host/Dockerfile --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.description=XC Circuit Host: projects, secrets and live sessions on a server of your own" \
            ${{ steps.names.outputs.tags }} --push .
          echo "Published ${{ steps.names.outputs.image }}" >> "$GITHUB_STEP_SUMMARY"
