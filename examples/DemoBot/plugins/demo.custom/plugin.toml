id          = "demo.custom"
name        = "DemoBot custom blocks"
version     = "1.0.0"
author      = "You"
description = "Blocks and editor tools that live inside this project. Edit them and they reload right away."

[engines]
circuit = "^1.0"

[contributes]
blocks = ["blocks/**/*.{js,ts}"]
# Bot › Settings › Levels: an example page.
botSettings = ["settings/*.toml"]

# Editor code: a Project Notes panel, a command and a TODO check.
[editor]
script = "editor.js"
