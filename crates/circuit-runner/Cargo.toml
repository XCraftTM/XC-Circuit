[package]
name = "circuit-runner"
description = "Runs and exports XC Circuit projects with Node.js"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23"
circuit-core.workspace = true
circuit-plugins.workspace = true
anyhow.workspace = true
indexmap.workspace = true
keyring.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
ureq = "3"
sha2 = "0.11"
flate2 = "1"
tar = "0.4"
# Uploading a bot to a server: SFTP (pure Rust, with ring like the rest), and
# the Calagopus panel's live console (a websocket over rustls).
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3"
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "io-util"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
