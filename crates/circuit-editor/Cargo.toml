[package]
name = "circuit-editor"
description = "XC Circuit: a node editor for building bots"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[[bin]]
name = "xc-circuit"
path = "src/main.rs"

[dependencies]
circuit-core.workspace = true
circuit-plugins.workspace = true
circuit-runner.workspace = true
anyhow.workspace = true
arboard = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libloading = "0.8"
xc-circuit-plugin = { path = "../xc-circuit-plugin" }
notify = "8"
dirs.workspace = true
eframe.workspace = true
egui_dock.workspace = true
egui_extras.workspace = true
image.workspace = true
indexmap.workspace = true
open.workspace = true
regex = "1"
ureq = "3"
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
toml.workspace = true
