[package]
name = "circuit-editor"
description = "XC Circuit: a node editor for building bots"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true

[[bin]]
name = "xc-circuit"
path = "src/main.rs"

[dependencies]
circuit-core.workspace = true
circuit-plugins.workspace = true
circuit-runner.workspace = true
anyhow.workspace = true
arboard = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
notify = "8"
dirs.workspace = true
eframe.workspace = true
# The fonts installed on the computer, for the Console's (already in the
# build through eframe's system fonts), and reading whether one is monospaced.
fontique = { version = "0.11", default-features = false, features = ["system"] }
skrifa = { version = "0.44", default-features = false, features = ["std"] }
# The symbol and emoji fonts (⚠, ✓, ▶ …) egui bundled up to 0.36; from 0.37
# on they come only with this feature.
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
# Colour emoji (the computer's emoji font, as in Discord): drawn by epaint
# with this feature.
epaint = { version = "0.37", default-features = false, features = ["color_fonts"] }
egui_extras.workspace = true
image.workspace = true
base64 = "0.23"
indexmap.workspace = true
open.workspace = true
regex = "1"
rquickjs.workspace = true
toml.workspace = true
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
rodio = { version = "0.23", default-features = false, features = ["playback", "wav", "mp3", "vorbis"] }
ureq = "3"
sha2 = "0.11"
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
raw-window-handle = "0.6"

# Only for its default features (Wayland window decorations, and its
# libraries loaded when the app starts), which eframe enables only with its
# own defaults: those also bring the screen reader bridge, left out here.
[target.'cfg(target_os = "linux")'.dependencies]
winit = "0.30.13"

[target.'cfg(windows)'.dependencies]
# Diagnostics_Debug (with Storage_FileSystem, System_Kernel and System_Memory,
# which its MiniDumpWriteDump needs) and System_Threading: the freeze
# detector's dumps.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_Debug", "Win32_Storage_FileSystem", "Win32_System_Kernel", "Win32_System_Memory", "Win32_System_Threading"] }

[build-dependencies]
png = "0.18"
winresource = "0.1"

[dev-dependencies]
# Walks the screens with its accessibility check: every control has a name.
egui_kittest = { version = "0.37", features = ["eframe"] }
toml.workspace = true
ron = "0.12"
